name: Release

on:
  push:
    tags:
      # Only fire on pinned semver tags (v3.0.0, v3.1.0, …).
      # Excludes the floating major tag (v3) so this workflow doesn't
      # re-trigger when we move it at the end of the job.
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build action
        run: yarn run build

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes in this Release
            - Deploy Domo apps using ryuu
            - Token-based authentication
            - Optional build command support
            - Comprehensive error handling
          draft: false
          prerelease: false
