name: Promote release to floating major tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pinned tag to promote (e.g. v3.1.0). The matching major tag (v3) will be force-moved to point at this tag."
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate input tag exists and is semver
        run: |
          TAG="${{ inputs.version }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag '$TAG' does not exist in this repo"
            exit 1
          fi

      - name: Move floating major tag
        run: |
          TAG="${{ inputs.version }}"
          MAJOR="${TAG%%.*}"                  # v3.1.0 -> v3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TAG"
          git push origin "$MAJOR" --force
          echo "::notice::Floating tag $MAJOR now points at $TAG"
